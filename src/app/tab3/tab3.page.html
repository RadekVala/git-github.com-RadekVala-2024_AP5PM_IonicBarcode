<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Settings </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list-header>Appearance</ion-list-header>
  <ion-list [inset]="true">
    <ion-item>
      <ion-toggle
        [(ngModel)]="paletteToggle"
        (ionChange)="toggleChange($event)"
        justify="space-between"
        >Dark Mode</ion-toggle
      >
    </ion-item>
    <ion-item>
      <ion-item>
        <ion-input
          [(ngModel)]="code"
          placeholder="Type here the code..."
        ></ion-input>
      </ion-item>
    </ion-item>

    <ion-button expand="full" (click)="fetchData()">Submit</ion-button>

    <ion-card *ngIf="apiData">
      <ion-card-header>
        <ion-card-title>{{ apiData.title }}</ion-card-title>
        <ion-card-subtitle>{{ apiData.brand }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-label>
              <h3>Category</h3>
              <p>{{ apiData.category }}</p>
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <h3>Energy value</h3>
              <p>
                {{ apiData.metanutrition?.energy_value }} {{
                apiData.metanutrition?.energy_unit }}
              </p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
