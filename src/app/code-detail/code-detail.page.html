<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- Back Button -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/history"></ion-back-button>
    </ion-buttons>
    <ion-title>Code: {{ code }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">code_detail</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngIf="apiData">
    <ion-card-header>
      <ion-card-title>{{ apiData.title }}</ion-card-title>
      <ion-card-subtitle>{{ apiData.brand }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <h3>Category</h3>
            <p>{{ apiData.category }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Energy value</h3>
            <p>
              {{ apiData.metanutrition?.energy_value | number: '1.0-2' }} {{
              apiData.metanutrition?.energy_unit }}
            </p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
