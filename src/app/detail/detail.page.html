<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/history"></ion-back-button>
    </ion-buttons>

    <ion-title>{{ upcResponse?.title ?? "Loading..."}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"
        >{{ upcResponse?.title ?? "Loading..."}}</ion-title
      >
    </ion-toolbar>
  </ion-header>

  <div class="ion-justify-content-center">
    <ion-spinner *ngIf="!upcResponse" name="circular"></ion-spinner>
  </div>

  <ion-card *ngIf="upcResponse">
    <ion-card-header>
      <ion-card-title>{{ upcResponse.brand }}</ion-card-title>
      <ion-card-subtitle>{{ upcResponse.category }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      {{ upcResponse.metanutrition.energy }} {{
      upcResponse.metanutrition.energy_unit }}
    </ion-card-content>
  </ion-card>
</ion-content>
